<h2>Tasks</h2>

<ul>
  <li *ngFor="let task of tasks$ | async">
    {{ task.id }} – {{ task.title }}
    <button (click)="removeTask(task.id)">X</button>
  </li>
</ul>

<div class="input-group mb-3">
  <input type="text" [(ngModel)]="newTaskTitle" placeholder="Nouvelle tâche" class="form-control" />
  <button (click)="addTask()" class="btn btn-primary">Ajouter</button>
</div>

<hr>

<h2>Compteur de temps</h2>
<p>Temps écoulé : {{ count / 2 }} secondes</p>
<button (click)="stopCounting()" class="btn btn-warning">Arrêter le compteur</button>
